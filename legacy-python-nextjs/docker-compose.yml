# ExamSeat AI -- full-stack deployment (Postgres + FastAPI + Next.js).
#
# Quick start:
#   docker compose up --build
#   Frontend: http://localhost:3000
#   Backend:  http://localhost:8000/docs
#
# The backend defaults to SQLite when run directly (see backend/app/config.py
# and the README's "Installation" section) -- this compose file switches it
# to Postgres via DATABASE_URL to exercise the production-shaped schema.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: examseat
      POSTGRES_PASSWORD: examseat
      POSTGRES_DB: examseat
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examseat"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://examseat:examseat@db:5432/examseat
      DATA_DIR: /app/data
      UPLOADS_DIR: /app/data/uploads
      PROCESSED_DIR: /app/data/processed
      DEMO_DIR: /app/data/demo
      REPORTS_DIR: /app/reports
      MODELS_DIR: /app/models
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./models:/app/models
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  db_data:
